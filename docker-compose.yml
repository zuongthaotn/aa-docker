services:
  algo_analytics:
    image: algo_analytics:v1.0
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: algo_analytics
    restart: "no"
    ports:
      - "8888:8888" 
    volumes:
      - ./src:/algo_analytics
      - ./scripts/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks:
      - algo_net

networks:
  algo_net:
